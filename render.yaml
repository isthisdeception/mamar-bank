# https://render.com/docs/blueprint-spec
databases:
  - name: mamarbank-db
    databaseName: mamarbank
    user: mamarbank
    plan: free

services:
  - type: web
    name: mamarbank
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn mamarbank.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2}
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: mamarbank-db
          property: connectionString
      # Set in the Render dashboard (Email tab / env groups) or uncomment and fill:
      # - key: EMAIL_HOST
      #   sync: false
      # - key: EMAIL_PORT
      #   sync: false
      # - key: EMAIL_HOST_USER
      #   sync: false
      # - key: EMAIL_HOST_PASSWORD
      #   sync: false
      # - key: EMAIL_USE_TLS
      #   value: "True"
